<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Boshqaruv Test Tizimi</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7fa;
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }
    .container {
      background: white;
      width: 100%;
      max-width: 550px;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      position: relative;
    }
    h1 { font-size: 22px; color: #1a202c; text-align: center; margin-top: 0; margin-bottom: 5px; }
    p.subtitle { color: #718096; text-align: center; margin-bottom: 25px; font-size: 14px; }
    
    .btn {
      width: 100%;
      background: #fff;
      border: 2px solid #e2e8f0;
      padding: 16px;
      border-radius: 10px;
      font-size: 15px;
      color: #2d3748;
      cursor: pointer;
      margin-bottom: 12px;
      text-align: left;
      transition: all 0.2s ease;
      line-height: 1.4;
    }
    .btn:active { transform: scale(0.98); }
    .cat-btn { text-align: center; font-weight: 600; color: #4a5568; font-size: 16px; }
    .btn:hover:not(.disabled):not(.correct):not(.wrong) { border-color: #cbd5e0; background: #f7fafc; }
    
    .btn.correct { background: #c6f6d5 !important; border-color: #48bb78 !important; color: #22543d !important; pointer-events: none; }
    .btn.wrong { background: #fed7d7 !important; border-color: #e53e3e !important; color: #742a2a !important; pointer-events: none; }
    .btn.disabled { opacity: 0.6; pointer-events: none; }
    
    .next-btn {
      background: #3182ce; color: white; text-align: center; border: none; font-weight: 600; margin-top: 15px; padding: 16px; border-radius: 10px; font-size: 16px;
    }
    .next-btn:hover { background: #2b6cb0; }
    
    .header { 
      display: flex; justify-content: space-between; align-items: center; 
      font-size: 14px; color: #718096; margin-bottom: 20px; 
      border-bottom: 2px solid #edf2f7; padding-bottom: 15px; 
    }
    .badge { background: #edf2f7; color: #4a5568; padding: 6px 12px; border-radius: 20px; font-weight: 600; font-size: 13px; }
    
    .question { font-size: 17px; font-weight: 600; margin-bottom: 25px; color: #1a202c; line-height: 1.5; }
    .iq-image-placeholder { background: #edf2f7; border: 1px dashed #cbd5e0; padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 15px; color: #718096; font-size: 14px; }
    
    .score-board { text-align: center; padding: 40px 0; background: #f7fafc; border-radius: 12px; margin-bottom: 20px; }
    .score-board h2 { color: #3182ce; font-size: 48px; margin: 10px 0; }
    .score-board p { color: #4a5568; font-size: 16px; font-weight: 500; }
  </style>
</head>
<body>

<div class="container" id="app"></div>

<script>
  const questionsData = {
    "Davlat tili": [
      {
        q: "Ushbu qo‘shma gap qismlari o‘rtasida qaysi tinish belgisi qo‘llanadi? Jismimiz yo‘qolur // o‘chmas nomimiz.",
        options: ["A) Tire ( - )", "B) Vergul ( , )", "C) Ikki nuqta ( : )", "D) Nuqtali vergul ( ; )"],
        a: "A) Tire ( - )"
      },
      {
        q: "Qaysi gapda qo‘shimcha qo‘llash bilan bog‘liq uslubiy xatolik mavjud?",
        options: ["A) U kishini so‘zlari yig‘ilganlarga juda kuchli ta’sir qildi.", "B) Biz bugungi darsni e’tibor bilan tingladik.", "C) Kitobning birinchi bobi o‘quvchini tezda o‘ziga tortadi.", "D) Bahor kelib, atrof yashil libosga burkandi."],
        a: "A) U kishini so‘zlari yig‘ilganlarga juda kuchli ta’sir qildi."
      },
      {
        q: "“Tavsifnomaga xodimning jamoatchilik va xizmat faoliyati, uning ishchanligi va axloqiy sifatlari ham ko‘rsatib o‘tiladi”. Ushbu gapda qanday xatolik uchraydi?",
        options: ["A) Kelishik qo‘shimchasi noto‘g‘ri qo‘llangan.", "B) So‘z tartibi buzilgan.", "C) Imloviy xatolikka yo‘l qo‘yilgan.", "D) So‘z o‘z ma’nosida qo‘llanmagan."],
        a: "A) Kelishik qo‘shimchasi noto‘g‘ri qo‘llangan."
      },
      {
        q: "Qaysi javobda so‘z qo‘llash bilan bog‘liq xatolik mavjud emas?",
        options: ["A) Yangi ochilgan zavod hududdagi minglab yoshlarni ish bilan ta’minladi.", "B) U o‘zining yaramas xulqi bilan barchaning hurmatiga sazovor bo‘ldi.", "C) Bog‘bon ehtiyotkorlik bilan daraxtlarning ildizini kesib tashladi.", "D) Binoning tashqi ko‘rinishi juda ham barbod qilingan edi."],
        a: "A) Yangi ochilgan zavod hududdagi minglab yoshlarni ish bilan ta’minladi."
      },
      {
        q: "Qaysi javobdagi joy nomlari to‘g‘ri yozilgan?",
        options: ["A) Orol dengizi, Farg‘ona vodiysi, Zarafshon tizmasi", "B) Orol Dengizi, farg‘ona vodiysi, Zarafshon tizmasi", "C) Orol dengizi, Farg‘ona Vodiysi, Zarafshon Tizmasi", "D) orol dengizi, Farg‘ona vodiysi, zarafshon tizmasi"],
        a: "A) Orol dengizi, Farg‘ona vodiysi, Zarafshon tizmasi"
      },
      {
        q: "Ushbu so‘zlardan nechtasida imloviy xatolik uchraydi? “Hashorat, talon-taroj, tannazul, tahqirlamoq”",
        options: ["A) 2 tasida", "B) 1 tasida", "C) 3 tasida", "D) Barchasida"],
        a: "A) 2 tasida"
      },
      {
        q: "Imloviy jihatdan to‘g‘ri yozilgan so‘zlar qatorini aniqlang.",
        options: ["A) Tafakkur, mutaxassis, inqilob", "B) Tafakur, mutahassis, inqilob", "C) Tafakkur, mutaxasis, inqilop", "D) Taffakur, mutaxassis, inqilob"],
        a: "A) Tafakkur, mutaxassis, inqilob"
      },
      {
        q: "“Mutaxasislarning fikricha, odamzodning tabiyatga nisbatan tajovuzkorona munosabati shu tahlit davom etaversa, virusli epidemiyalar hayot uchun jiddiy taxdid bo‘lishi mumkin”. Ushbu gapda necha o‘rinda imloviy xatolik uchraydi?",
        options: ["A) 4 o‘rinda", "B) 2 o‘rinda", "C) 3 o‘rinda", "D) 5 o‘rinda"],
        a: "A) 4 o‘rinda"
      },
      {
        q: "Qaysi javobda so‘z qo‘llash bilan bog‘liq xatolik mavjud?",
        options: ["A) Bahor kelishi bilan bog‘larda gullar qiyg‘os ochilib, atrofni qo‘lansa hid qopladi.", "B) Kuzgi yig‘im-terim paytida dehqonlar tinim bilmay ishladilar.", "C) Yangi nashrdan chiqqan kitob tez orada o‘quvchilar e’tiborini qozondi.", "D) Qishning qahraton kunlarida issiqroq kiyinish tavsiya etiladi."],
        a: "A) Bahor kelishi bilan bog‘larda gullar qiyg‘os ochilib, atrofni qo‘lansa hid qopladi."
      }
    ],
    "Milliy qonunchilik": [
      {
        q: "Xalq deputatlari Kengashining vakolatlari muddati necha yil?",
        options: ["A) 5 yil", "B) 3 yil", "C) 4 yil", "D) 7 yil"],
        a: "A) 5 yil"
      },
      {
        q: "Oliy Majlis Qonunchilik palatasi deputatini daxlsizlik huquqidan mahrum etish to‘g‘risidagi taqdimnomani qaysi subyekt tomonidan bildirilishi mumkin?",
        options: ["A) O‘zbekiston Respublikasi Bosh prokurori", "B) O‘zbekiston Respublikasi Prezidenti", "C) Oliy Majlis Qonunchilik palatasi Spikeri", "D) O‘zbekiston Respublikasi Oliy sudi raisi"],
        a: "A) O‘zbekiston Respublikasi Bosh prokurori"
      },
      {
        q: "Agar qonunchilikda boshqacha qoida nazarda tutilmagan bo‘lsa, ma’muriy organ ... qancha muddatdan kechiktirmay ma’muriy ishni ko‘rib chiqadi va ma’muriy hujjatni qabul qiladi?",
        options: ["A) 30 ish kunidan kechiktirmay", "B) 15 ish kunidan kechiktirmay", "C) 20 ish kunidan kechiktirmay", "D) 1 oydan kechiktirmay"],
        a: "A) 30 ish kunidan kechiktirmay"
      },
      {
        q: "Ta’lim muassasalarida korrupsiyaga qarshi kurashish sohasida huquqiy ta’lim va tarbiyaga doir chora-tadbirlarni amalga oshirishda ishtirok etish qaysi subyektning vakolatlari doirasiga kiradi?",
        options: ["A) O‘zbekiston Respublikasi Adliya vazirligi", "B) O‘zbekiston Respublikasi Oliy ta’lim, fan va innovatsiyalar vazirligi", "C) O‘zbekiston Respublikasi Bosh prokuraturasi", "D) O‘zbekiston Respublikasi Korrupsiyaga qarshi kurashish agentligi"],
        a: "A) O‘zbekiston Respublikasi Adliya vazirligi"
      },
      {
        q: "Davlat fuqarolik xizmatchisi tomonidan xizmat safarlari, xalqaro va boshqa rasmiy tadbirlar munosabati bilan olinishi mumkin bo‘lgan sovg‘a qiymati, shuningdek uni tasarruf etish tartibi qaysi tashkilot tomonidan belgilanadi?",
        options: ["A) Korrupsiyaga qarshi kurashish bo‘yicha maxsus vakolatli davlat organi", "B) O‘zbekiston Respublikasi Adliya vazirligi", "C) Davlat xizmatini rivojlantirish agentligi", "D) O‘zbekiston Respublikasi Moliya va iqtisodiyot vazirligi"],
        a: "A) Korrupsiyaga qarshi kurashish bo‘yicha maxsus vakolatli davlat organi"
      },
      {
        q: "Davlat siyosiy rejim shakliga ko‘ra qanday guruhlarga bo‘linadi?",
        options: ["A) Demokratik, avtoritar, totalitar", "B) Monarxiya va respublika", "C) Unitar, federatsiya, konfederatsiya", "D) Siyosiy, iqtisodiy, ijtimoiy"],
        a: "A) Demokratik, avtoritar, totalitar"
      },
      {
        q: "Davlat fuqarolik xizmatchisiga davomiyligi qancha kundan kam bo‘lmagan yillik asosiy ta’til beriladi?",
        options: ["A) 27 kalendar kunidan", "B) 21 kalendar kunidan", "C) 24 kalendar kunidan", "D) 30 kalendar kunidan"],
        a: "A) 27 kalendar kunidan"
      }
    ],
    "Axborot-kommunikatsiya": [
      {
        q: "Abonentlar (mijozlar) uchun mobil aloqa xizmatlarini taklif qiluvchi tashkilot qaysi javobda to‘g‘ri berilgan?",
        options: ["A) Mobil aloqa operatori (yoki Provayder)", "B) Internet-do‘kon va elektron tijorat platformasi", "C) Qidiruv tizimi (Search engine)", "D) Operatsion tizim ishlab chiquvchi kompaniya"],
        a: "A) Mobil aloqa operatori (yoki Provayder)"
      },
      {
        q: "Dasturlar qanday turkumga bo‘linadi?",
        options: ["A) Tizimli (sistemali), amaliy va uskunaviy (dasturlash vositalari)", "B) Mahalliy, mintaqaviy va global", "C) Qattiq, yumshoq va gibrid", "D) Matnli, grafikli va ovozli dasturlar"],
        a: "A) Tizimli (sistemali), amaliy va uskunaviy (dasturlash vositalari)"
      },
      {
        q: "Kompyuter diskida yoki ixtiyoriy axborot tashuvchida joy Saxon bo‘lgan “*.xls” kengaytmali faylga sichqoncha ko‘rsatkichi bilan ikki marta bosilsa qanday jarayon sodir bo‘ladi?",
        options: ["A) Microsoft Excel dasturi ishga tushadi va fayl ochiladi", "B) Microsoft Word dasturi ishga tushadi", "C) Fayl avtomatik tarzda o‘chiriladi", "D) Antivirus dasturi ishga tushadi"],
        a: "A) Microsoft Excel dasturi ishga tushadi va fayl ochiladi"
      },
      {
        q: "... – internetning birinchi va eng keng tarqalgan xizmati hisoblanadi.",
        options: ["A) Elektron pochta (E-mail)", "B) Ijtimoiy tarmoqlar", "C) Onlayn video o‘yinlar", "D) Bulutli xotira xizmati"],
        a: "A) Elektron pochta (E-mail)"
      },
      {
        q: "Internet tarmog‘iga ajratilgan liniya orqali ulanish usuli to‘g‘ri berilgan javobni belgilang.",
        options: ["A) ADSL va optik tolali (Fiber-optic) ulanish", "B) Telefon liniyasi orqali kommutatsiyalangan (Dial-up) ulanish", "C) Faqat Wi-Fi orqali simsiz ulanish", "D) Sun’iy yo‘ldosh orqali mobil ulanish"],
        a: "A) ADSL va optik tolali (Fiber-optic) ulanish"
      },
      {
        q: "Xalqaro doiradagi kompyuter tarmog‘i qanday nomlanadi?",
        options: ["A) Global tarmoq (WAN - Wide Area Network / Internet)", "B) Mahalliy tarmoq (LAN - Local Area Network)", "C) Mintaqaviy tarmoq (MAN - Metropolitan Area Network)", "D) Shaxsiy tarmoq (PAN - Personal Area Network)"],
        a: "A) Global tarmoq (WAN - Wide Area Network / Internet)"
      },
      {
        q: "Qaysi texnologiya real dunyo bilan raqamli ma’lumotlarni birlashtiradi va butunlay raqamli, simulyatsiyalangan muhit yaratadi?",
        options: ["A) To‘ldirilgan reallik (AR) va Virtual reallik (VR)", "B) Katta ma’lumotlar (Big Data) va Blokcheyn", "C) Sun’iy intellekt (AI) va Mashinali o‘qitish", "D) Bulutli hisoblashlar (Cloud computing)"],
        a: "A) To‘ldirilgan reallik (AR) va Virtual reallik (VR)"
      },
      {
        q: "Microsoft Word dasturida quyidagi tugmalar birikmasining qaysi biri hujjatda tanlangan matn uchun 'kursiv' shriftini qo‘yishda foydalaniladi?",
        options: ["A) Ctrl + I", "B) Ctrl + B", "C) Ctrl + U", "D) Ctrl + C"],
        a: "A) Ctrl + I"
      },
      {
        q: "Algoritm nima?",
        options: ["A) Ma’lum bir maqsadga erishish uchun bajarilishi kerak bo‘lgan aniq va ketma-ket harakatlar to‘plami", "B) Kompyuterning axborotni ishlash tezligini o‘lchaydigan maxsus qurilma", "C) Internet tarmog‘idagi xavfsizlikni ta’minlovchi antivirus dasturi", "D) Dastur kodlaridagi xatolarni avtomatik to‘g‘rilovchi mexanizm"],
        a: "A) Ma’lum bir maqsadga erishish uchun bajarilishi kerak bo‘lgan aniq va ketma-ket harakatlar to‘plami"
      },
      {
        q: "“O‘zbekiston” so‘zining axborot o‘lchami qaysi javobda to‘g‘ri berilgan?",
        options: ["A) 11 bayt (88 bit)", "B) 10 bayt (80 bit)", "C) 11 bit", "D) 1 kilobayt"],
        a: "A) 11 bayt (88 bit)"
      },
      {
        q: "Har qanday axborot texnologiyasining majburiy komponenti nima?",
        options: ["A) Texnik vositalar (apparat ta’minoti), dasturiy ta’minot va inson omili (foydalanuvchi)", "B) Faqatgina yuqori tezlikdagi internet tarmog‘i", "C) Matn muharriri va elektron jadvallar", "D) Bulutli xotira va sun’iy intellekt"],
        a: "A) Texnik vositalar (apparat ta’minoti), dasturiy ta’minot va inson omili (foydalanuvchi)"
      },
      {
        q: "Microsoft Word dasturining eng so‘nggi versiyalarida qaysi yangi imkoniyatlar marvel?",
        options: ["A) Bulutli texnologiyalar orqali birgalikda ishlash, avtomatik saqlash va sun’iy intellekt integratsiyasi", "B) Dasturning faqat matn o‘qish rejimida ishlashi", "C) Hujjatlarni faqat bitta kompyuterning o‘zida saqlash majburiyati", "D) Videofayllarni montaj qilish vositalari"],
        a: "A) Bulutli texnologiyalar orqali birgalikda ishlash, avtomatik saqlash va sun’iy intellekt integratsiyasi"
      }
    ],
    "Mantiq (IQ)": [
      {
        q: "Rasmda berilgan shakllar jami necha dona kichik kubiklardan tashkil topganini aniqlang.",
        iqImage: "1-rasm o‘rni: Kubiklar yig‘indisi",
        options: ["A) 40", "B) 38", "C) 42", "D) 44"],
        a: "A) 40"
      },
      {
        q: "Asosiy shaklni to‘liq qutiga aylantirish uchun quyidagi variantlardan qaysi biri yetishmayotgan qism hisoblanadi?",
        iqImage: "2-rasm o‘rni: Zina ko‘rinishidagi kubiklar va 4 xil variant",
        options: ["A) 2-shakl", "B) 1-shakl", "C) 3-shakl", "D) 4-shakl"],
        a: "A) 2-shakl"
      },
      {
        q: "Kesib olingan uchburchakning yetishmayotgan qismini toping.",
        iqImage: "3-rasm o‘rni: Qirqilgan uchburchak qismlari",
        options: ["A) 4-shakl", "B) 1-shakl", "C) 2-shakl", "D) 3-shakl"],
        a: "A) 4-shakl"
      },
      {
        q: "Berilgan oltiburchakli shaklni ko‘rsatilgan o‘q yo‘nalishida 270° ga burganda qaysi holatga kelishini aniqlang.",
        iqImage: "4-rasm o‘rni: Ichida yulduzchasi bor oltiburchak burilishi",
        options: ["A) 1-shakl", "B) 2-shakl", "C) 3-shakl", "D) 4-shakl"],
        a: "A) 1-shakl"
      },
      {
        q: "Sakkizburchak ichidagi nuqtalar harakatlanish qonuniyatini aniqlab, ketma-ketlikdagi keyingi shaklni toping.",
        iqImage: "5-rasm o‘rni: Sakkizburchak va qora-oq nuqtalar",
        options: ["A) 5-shakl", "B) 1-shakl", "C) 3-shakl", "D) 6-shakl"],
        a: "A) 5-shakl"
      }
    ]
  };

  const app = document.getElementById('app');
  let activeCategory = null;
  let currentQ = 0;
  let score = 0;
  let answered = false;

  function renderMenu() {
    let html = `
      <h1>Boshqaruv Test Tizimi</h1>
      <p class="subtitle">O‘z yo‘nalishingizni tanlang</p>
      <div style="display:flex; flex-direction:column; gap:8px;">
    `;
    for (let cat in questionsData) {
      let qCount = questionsData[cat].length;
      html += `<button class="btn cat-btn" onclick="startQuiz('${cat}')">${cat} <br><span style="font-size:12px; color:#718096; font-weight:normal;">(${qCount} ta savol)</span></button>`;
    }
    html += `</div>`;
    app.innerHTML = html;
  }

  window.startQuiz = function(cat) {
    activeCategory = cat; 
    currentQ = 0; 
    score = 0; 
    answered = false;
    renderQuestion();
  };

  function renderQuestion() {
    answered = false;
    const data = questionsData[activeCategory][currentQ];
    
    let html = `
      <div class="header">
        <span class="badge">${activeCategory}</span>
        <span style="font-weight:600;">Savol: ${currentQ + 1} / ${questionsData[activeCategory].length}</span>
      </div>
      <div class="question">${data.q}</div>
    `;

    if(data.iqImage) {
      html += `<div class="iq-image-placeholder">[ ${data.iqImage} ]</div>`;
    }

    html += `<div id="options" style="display:flex; flex-direction:column;"></div>`;
    app.innerHTML = html;

    const optionsDiv = document.getElementById('options');
    data.options.forEach((opt, index) => {
      let btn = document.createElement('button');
      btn.className = 'btn';
      btn.innerText = opt;
      btn.onclick = () => handleAnswer(btn, opt, data.a);
      optionsDiv.appendChild(btn);
    });
  }

  window.handleAnswer = function(btn, selected, correct) {
    if (answered) return;
    answered = true;
    
    const allBtns = document.querySelectorAll('#options .btn');
    allBtns.forEach(b => {
      b.classList.add('disabled');
      if (b.innerText === correct) {
        b.classList.remove('disabled');
        b.classList.add('correct');
      }
    });

    if (selected === correct) {
      score++;
    } else {
      btn.classList.add('wrong');
      btn.classList.remove('disabled'); 
    }

    let nextBtn = document.createElement('button');
    nextBtn.className = 'btn next-btn';
    nextBtn.innerText = currentQ < questionsData[activeCategory].length - 1 ? "Keyingi savol" : "Natijani ko‘rish";
    nextBtn.onclick = () => {
      currentQ++;
      if (currentQ < questionsData[activeCategory].length) {
        renderQuestion();
      } else {
        renderResult();
      }
    };
    document.getElementById('options').appendChild(nextBtn);
  }

  function renderResult() {
    let percentage = Math.round((score / questionsData[activeCategory].length) * 100);
    app.innerHTML = `
      <div class="score-board">
        <p>Sizning natijangiz</p>
        <h2>${score} / ${questionsData[activeCategory].length}</h2>
        <p>To‘g‘ri javoblar ko‘rsatkichi: ${percentage}%</p>
      </div>
      <button class="btn cat-btn" onclick="renderMenu()" style="border-color:#3182ce; color:#3182ce;">Asosiy menuga qaytish</button>
    `;
  }

  renderMenu();
</script>
</body>
</html>
